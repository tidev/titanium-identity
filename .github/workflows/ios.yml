name: iOS Build
on:
  push:
    paths-ignore:
    - 'android/**'
    - 'apidoc/**'
  pull_request:
    paths-ignore:
    - 'android/**'
    - 'apidoc/**'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    name: iOS
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - run: npm ci
      name: Install dependencies

    - run: npm run lint:ios
      name: Lint

    - run: npm i -g titanium
      name: Install Titanium CLI

    # ios/titanium.xcconfig is the single source of truth for the SDK the
    # module is built against, so the workflow reads it instead of pinning
    # a second copy of the version here.
    - name: Read Titanium SDK version
      id: sdk
      run: echo "version=$(sed -n 's/^TITANIUM_SDK_VERSION = //p' ios/titanium.xcconfig)" >> "$GITHUB_OUTPUT"

    - name: Cache Titanium SDK
      id: sdk-cache
      uses: actions/cache@v6
      with:
        path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.sdk.outputs.version }}
        key: ${{ runner.os }}-tisdk-${{ steps.sdk.outputs.version }}

    - run: ti sdk install ${{ steps.sdk.outputs.version }}
      name: Install Titanium SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'

    - run: ti build -p ios -b --sdk ${{ steps.sdk.outputs.version }}
      name: Build
      working-directory: ios

    - name: Archive iOS artifact
      uses: actions/upload-artifact@v7
      with:
        name: ti.identity-ios
        path: ios/dist/ti.identity-iphone-*.zip
        if-no-files-found: error
