name: Android Build
on:
  push:
    paths-ignore:
    - 'ios/**'
    - 'apidoc/**'
  pull_request:
    paths-ignore:
    - 'ios/**'
    - 'apidoc/**'
  workflow_dispatch:

env:
  TITANIUM_SDK_VERSION: 13.4.1.GA

jobs:
  android:
    runs-on: macos-latest
    name: Android
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - run: npm ci
      name: Install dependencies

    - run: npm run lint:android
      name: Lint

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - run: npm i -g titanium
      name: Install Titanium CLI

    - name: Cache Titanium SDK
      id: sdk-cache
      uses: actions/cache@v6
      with:
        path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ env.TITANIUM_SDK_VERSION }}
        key: ${{ runner.os }}-tisdk-${{ env.TITANIUM_SDK_VERSION }}

    - run: ti sdk install ${{ env.TITANIUM_SDK_VERSION }}
      name: Install Titanium SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'

    - run: ti build -p android -b --sdk ${{ env.TITANIUM_SDK_VERSION }}
      name: Build
      working-directory: android

    - name: Archive Android artifact
      uses: actions/upload-artifact@v7
      with:
        name: ti.identity-android
        path: android/dist/ti.identity-android-*.zip
        if-no-files-found: error

    - name: Cleanup Gradle Cache
      # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
      # Restoring these files from a GitHub Actions cache might cause problems for future builds.
      run: |
        rm -f ~/.gradle/caches/modules-2/modules-2.lock
        rm -f ~/.gradle/caches/modules-2/gc.properties
