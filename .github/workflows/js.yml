name: JavaScript Lint
on:
  push:
    paths:
    - '**.js'
    - '**.json'
    - '**.eslint*'
  pull_request:
    paths:
    - '**.js'
    - '**.json'
    - '**.eslint*'
  workflow_dispatch:

jobs:
  js:
    runs-on: ubuntu-latest
    name: JavaScript
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - run: npm ci
      name: Install dependencies

    - run: npm run lint:js
      name: Lint
